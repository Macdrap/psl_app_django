name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Never run two deploys at once: they would race on the security group rule.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  SECURITY_GROUP_ID: sg-0f9ae77e7d2f2fe50

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2

    - name: Allow SSH from this runner's IP only
      id: open_ssh
      run: |
        set -euo pipefail
        RUNNER_IP="$(curl -fsS --retry 3 --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')"
        if ! [[ "$RUNNER_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
          echo "::error::Could not determine runner public IPv4 address (got '$RUNNER_IP')"
          exit 1
        fi
        RUNNER_CIDR="$RUNNER_IP/32"
        echo "cidr=$RUNNER_CIDR" >> "$GITHUB_OUTPUT"
        echo "Allowing SSH from $RUNNER_CIDR on $SECURITY_GROUP_ID"
        if aws ec2 authorize-security-group-ingress \
             --group-id "$SECURITY_GROUP_ID" --protocol tcp --port 22 --cidr "$RUNNER_CIDR"; then
          # Only revoke afterwards if this run created the rule.
          echo "added=true" >> "$GITHUB_OUTPUT"
        else
          echo "Rule for $RUNNER_CIDR might already exist; it will be left in place"
        fi

    - name: Deploy to EC2
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        timeout: 60s
        command_timeout: 15m
        script: |
          cd /opt/psl-app
          
          # Show current status
          echo "=== Current commit ==="
          sudo git log -1 --oneline
          
          # Fetch and reset to latest (handles any local changes)
          echo "=== Updating code ==="
          sudo git fetch origin main
          sudo git reset --hard origin/main
          
          # Show new commit
          echo "=== Updated to commit ==="
          sudo git log -1 --oneline
          
          # Create/update .env file with secrets from GitHub
          echo "=== Creating .env file ==="
          sudo tee .env > /dev/null <<EOF
          SECRET_KEY="${{ secrets.SECRET_KEY }}"
          DEBUG=False
          DB_NAME="${{ secrets.DB_NAME }}"
          DB_USER="${{ secrets.DB_USER }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          DB_HOST=db
          DB_PORT=5432
          ALLOWED_HOSTS="${{ secrets.EC2_HOST }}"
          EOF
          
          # Make deploy script executable
          sudo chmod +x scripts/deploy.sh
          sudo chmod +x scripts/backup-database.sh
          sudo chmod +x scripts/renew.sh
          sudo chmod +x scripts/start.sh
          
          # Run the deployment script
          echo "=== Running deployment script ==="
          sudo bash scripts/deploy.sh
          
          echo "=== Deployment finished ==="

    - name: Revoke runner SSH access
      if: always()
      run: |
        ADDED="${{ steps.open_ssh.outputs.added }}"
        RUNNER_CIDR="${{ steps.open_ssh.outputs.cidr }}"
        if [ "$ADDED" = "true" ] && [ -n "$RUNNER_CIDR" ]; then
          echo "Revoking SSH from $RUNNER_CIDR on $SECURITY_GROUP_ID"
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" --protocol tcp --port 22 --cidr "$RUNNER_CIDR"
        else
          echo "No rule was added by this run; nothing to revoke"
        fi
        # Clean up any world-open SSH rule left behind by earlier versions of this workflow.
        aws ec2 revoke-security-group-ingress \
          --group-id "$SECURITY_GROUP_ID" --protocol tcp --port 22 --cidr 0.0.0.0/0 2>/dev/null \
          && echo "Removed leftover 0.0.0.0/0 SSH rule" || true

    - name: Ensure SSH from trusted IP
      if: always()
      env:
        TRUSTED_IP: ${{ secrets.MY_CURRENT_IP_CIDR_FORMAT }}
      run: |
        if [ -n "$TRUSTED_IP" ]; then
          echo "Authorizing SSH from trusted IP"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" --protocol tcp --port 22 --cidr "$TRUSTED_IP" || true
        fi
